name: CI

# Lint and test on every push and pull request. Installers are built only on a release branch named
# release/<version> (e.g. release/0.2.0, where the version equals the one in package.json), and only
# once lint and tests pass; that branch also gets a draft GitHub release tagged v<version>.
on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Frontend (lint, typecheck, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # `build` is `tsc && vite build`: the typecheck, plus compiling all the SCSS.
      - run: npm run build

  rust-lint:
    name: Rust (rustfmt, clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The tests build real repositories and talk to local bare remotes with the system git.
      - run: git --version
      - run: cargo test --lib --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.name }})
    needs: [frontend, rust-lint, rust-test]
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
            artifact: rusty-git-client-windows
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - name: macOS (universal)
            os: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: rusty-git-client-macos
            files: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - name: The branch name must match the app version
        shell: bash
        run: |
          branch_version="${GITHUB_REF_NAME#release/}"
          branch_version="${branch_version#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$branch_version" != "$version" ]; then
            echo "Branch $GITHUB_REF_NAME does not match the version in package.json ($version)" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the installers
        shell: bash
        run: npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#release/}"
          version="${version#v}"
          ls -l installers
          gh release create "v$version" installers/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --generate-notes --title "Rusty Git Client v$version"
